
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Moving Images</title>

  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>


<body>

  <!--
  The design of this website is inspired by the visual style of early 
  cinemas. Since the selected artworks are mainly 2D animations and 
  video art, I chose a simple colour palette and visual style to avoid
  distracting from the artwork.

  The interface is divided into three functional areas: the information 
  area, the video area and the interaction area. This creates a clear 
  structure while maintaining an exhibition-like viewing experience.
  The author of the first, second and fourth videos is me, and the
  author of the third video is my brother. I have obtained his consent 
  to use this video.

-->
  <header>
    <h1>MOVING IMAGES</h1>
  </header>


  <main class="container">

    <!--
  The archive frame uses a two-column structure.The left side focuses
  on video playback and artwork selection, while the right side displays 
  information about the selected artwork.

  I found that this kind of separated information layout is commonly 
  used in notebook and journal page designs that I researched online. 
  I chose to adapt this structure because it makes the information
  easier to organise while also creating a balanced visual composition.
-->

    <div class="archive-frame">


      

      <div class="archive-left">

        <!--
  The video player is the main visual element of the website. I use a 
  custom player instead of the browser's default controls so that the 
  interface can maintain a consistent visual style.
-->
        <div class="media-player">

          <video id="custom-video-player">
            <source
              src="video/A3.mp4"
              type="video/mp4"
            />
          </video>

<!--
  The custom controls provide simple playback interaction.The play
  button and progress bar are kept visually minimal so that they support
  the viewing experience without becoming more prominent than the artwork.
-->
          <div class="custom-controls">

            <button id="play-pause-btn">PLAY</button>

            <div class="progress-bar" id="progress-bar">
              <span id="progress-bar-fill"></span>
            </div>

          </div>

        </div>


        <section class="artwork-list">

      <!--
  The artwork list functions as the main navigation for the moving-image
 archive.

  Each artwork button stores information about the corresponding work 
  using data attributes. I was not familiar with this method before 
  developing this project, so I used AI assistance to understand how 
  JavaScript could read information stored in the HTML.

  This structure allows the video filename, title, description, year 
  and author to be stored together with each artwork. It also means 
  that more artworks can be added without creating separate JavaScript
  instructions for every video.

-->

          <button
            data-video="A3.mp4"
            data-number="01"
            data-title="COLLAGE"
            data-category="2D ANIMATION"
            data-description="A first-semester After Effects work inspired by the Backrooms, the game Rusty Lake, and well-known historical artworks."
            data-year="2025"
            data-author="YAEL"
          >
            01 — COLLAGE
          </button>


          <button
            data-video="duobaoyu.mp4"
            data-number="02"
            data-title="DUOBAOYU"
            data-category="2D ANIMATION"
            data-description="A 2D animation made in After Effects as a birthday gift for a friend. The protagonist is based on his own image."
            data-year="2026"
            data-author="YAEL"
          >
            02 — DUOBAOYU
          </button>


          <button
            data-video="P3.mp4"
            data-number="03"
            data-title="PERSONA 3"
            data-category="VIDEO EDIT"
            data-description="A character-focused video edit featuring Makoto Yuki, the protagonist of the game Persona 3."
            data-year="2026"
            data-author="YUAKS"
          >
            03 — PERSONA 3
          </button>


          <button
            data-video="eden.mp4"
            data-number="04"
            data-title="EDEN"
            data-category="2D ANIMATION"
            data-description="A 2D animation made in After Effects as a birthday gift for a friend. The protagonist is based on his own image. The title Eden comes from the town where the artwork was created and where visual research was collected."
            data-year="2026"
            data-author="YAEL"
          >
            04 — EDEN
          </button>

        </section>

      </div>


      <!--
      The information panel displays details about the selected artwork.
      The panel is not only used to provide information. I also 
      designed it as part of the overall typography and composition, 
      so the text can act as a visual element and balance the video 
      on the left side.
      
      -->

      <div class="archive-right">

        <p id="artwork-number">01 / 04</p>


        <div class="artwork-main-info">

          <h2 id="artwork-title">COLLAGE</h2>

          <p
            id="artwork-category"
            class="artwork-category"
          >
            2D ANIMATION
          </p>


          <p
            id="artwork-description"
            class="artwork-description"
          >
            A first-semester After Effects work inspired by
            the Backrooms, the game Rusty Lake, and
            well-known historical artworks.
          </p>

        </div>


        <div class="artwork-meta">

          <p id="artwork-year">2025</p>

          <p id="artwork-author">YAEL</p>

        </div>

      </div>

    </div>

  </main>


  <footer></footer>

</body>

</html>

<!--
AI acknowledgement: ChatGPT was used to support code explanation, 
debugging and language editing during development. The final structure,
design decisions and implementation were reviewed and adapted by myself
  
-->
